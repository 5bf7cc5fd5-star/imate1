<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Own Club System</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#1e293b}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #e6ebf2;border-radius:12px;padding:16px;margin:12px 0}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #dbe3ef;border-radius:8px}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.g{background:#16a34a;color:#fff}.r{background:#dc2626;color:#fff}.p{background:#2563eb;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="login">
  <div class="card" style="max-width:400px;margin:12vh auto">
    <h2>OWNCLUB System</h2>
    <input id="em" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <button class="p" style="width:100%" onclick="login()">Log in</button>
    <p id="err" style="color:#b91c1c"></p>
  </div>
</div>
<div class="wrap hidden" id="dash">
  <p><a href="/">← Member app</a> · <button class="r" onclick="logout()">Log out</button></p>
  <h2>Members & deposits</h2>
  <div id="box">Loading…</div>
</div>
<script>
var T=localStorage.getItem("oc_admin")||"";
function api(p,m,b){
  var o={method:m||"GET",headers:{"Content-Type":"application/json"}};
  if(T) o.headers.Authorization="Bearer "+T;
  if(b) o.body=JSON.stringify(b);
  return fetch(p,o).then(function(r){return r.json().then(function(j){if(!r.ok) throw new Error(j.error||r.status);return j;});});
}
function login(){
  api("/api/login","POST",{identifier:document.getElementById("em").value,password:document.getElementById("pw").value})
    .then(function(r){
      if(!r.user || !(r.user.is_admin||r.user.is_support)){ document.getElementById("err").textContent="Not a system account"; return; }
      T=r.token; localStorage.setItem("oc_admin",T); show();
    }).catch(function(e){ document.getElementById("err").textContent=e.message; });
}
function logout(){ localStorage.removeItem("oc_admin"); location.reload(); }
function show(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dash").classList.remove("hidden");
  load();
}
function load(){
  api("/api/admin/users").then(function(r){
    var h="<table><tr><th>Member</th><th>Balance</th><th>Deposits</th></tr>";
    (r.users||[]).forEach(function(u){
      var deps=(u.deposits||[]).map(function(d){
        var btns = d.status==="pending"
          ? "<button class='g' onclick='act(\""+u.id+"\",\""+d.id+"\",\"approve\")'>Approve</button> "
            +"<button class='r' onclick='act(\""+u.id+"\",\""+d.id+"\",\"reject\")'>Reject</button>"
          : d.status;
        return "<div>"+Number(d.amount).toLocaleString()+" · "+(d.txid||"")+" · "+btns+"</div>";
      }).join("");
      h += "<tr><td><b>"+u.name+"</b><br>"+u.phone+"<br>"+u.email+"<br>"+(u.title||"")+"</td><td>UGX "+Number(u.balance||0).toLocaleString()+"</td><td>"+(deps||"—")+"</td></tr>";
    });
    document.getElementById("box").innerHTML=h+"</table>";
  }).catch(function(e){ document.getElementById("box").textContent=e.message; });
}
function act(uid,did,a){
  api("/api/admin/deposit-action","POST",{user_id:uid,deposit_id:did,action:a}).then(load).catch(function(e){alert(e.message);});
}
if(T){
  api("/api/me").then(function(r){ if(r.user && (r.user.is_admin||r.user.is_support)) show(); }).catch(function(){});
}
</script>
</body>
</html>
