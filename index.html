<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Own Club — Share Market</title>
</head>
<body style="margin:0;background:#03070d;color:#fff;font-family:system-ui">
<p id="st" style="padding:28px;text-align:center">Loading Own Club…</p>
<script>
(async function(){
  try{
    var parts=[];
    for(var i=1;i<=8;i++){
      var t=await fetch("/static/a"+i+".b64",{cache:"no-store"}).then(function(r){
        if(!r.ok) throw new Error("missing part "+i);
        return r.text();
      });
      var bin=Uint8Array.from(atob(t.replace(/\s/g,"")), function(c){return c.charCodeAt(0);});
      var stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
      parts.push(await new Response(stream).text());
    }
    document.open();
    document.write(parts.join(""));
    document.close();
  }catch(e){
    document.getElementById("st").textContent="Could not load app: "+e.message;
  }
})();
</script>
</body></html>
