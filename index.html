<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Own Club</title></head>
<body style="margin:0;background:#03070d;color:#fff;font-family:system-ui;padding:24px;text-align:center">
<p>Loading Own Club…</p>
<script>
fetch("/frontend.html",{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error("frontend.html not uploaded yet");
  return r.text();
}).then(function(html){
  if(html.indexOf("Own Club")===-1 && html.indexOf("imate1")===-1) throw new Error("placeholder");
  if(html.length < 50000) throw new Error("frontend.html is still the small placeholder");
  document.open(); document.write(html); document.close();
}).catch(function(e){
  document.body.innerHTML = "<p>Upload <b>frontend.html</b> from the 14 August zip.</p><p><a href='https://github.com/5bf7cc5fd5-star/ownclubshares.co/upload/main' style='color:#1ebcff'>Open GitHub upload</a></p><p style='color:#8aa'>"+e.message+"</p>";
});
</script>
</body></html>
