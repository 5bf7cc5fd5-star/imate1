name: Deploy Own Club to Railway

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Add GitHub secret RAILWAY_TOKEN (Railway → Account → Tokens)"
            exit 1
          fi
          railway up --ci --service "${RAILWAY_SERVICE:-}" || railway up --ci
