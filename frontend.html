<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Own Club — Share Market</title>
<style>
:root{--bg:#071018;--card:#0d1b28;--line:#1a4a6a;--blue:#1ebcff;--green:#20e58b;--text:#f4f8ff;--muted:#8aa0b5}
*{box-sizing:border-box}html,body{margin:0;background:#03070d;color:var(--text);font-family:Inter,system-ui,sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 14px 90px;position:relative}
h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#07141f;color:#fff}
.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#1283d4;color:#fff;font-weight:700;margin-top:8px}
.btn.sec{background:#163044}
.btn.green{background:#168a4b}.btn.red{background:#b91c1c}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:#0a1620;color:#9ab;border-radius:10px;padding:10px;font-weight:700}
.tabs button.on{background:#123a55;color:#fff}
.league{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}
.league button{flex:0 0 auto;border:1px solid var(--line);background:#0a1620;color:#cde;border-radius:20px;padding:8px 12px;font-size:12px}
.league button.on{background:#1a4a6a;color:#fff}
.club{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #123}
.club img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px}
.kpi{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #123}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);background:#071018;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;color:#7a8;font-size:10px}
.nav button b{display:block;font-size:16px}
.nav button.on{color:var(--green)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#123;padding:10px 14px;border-radius:10px;display:none;z-index:20}
#auth{min-height:100vh;display:flex;align-items:center}
</style>
</head>
<body>
<div class="app" id="auth">
  <div style="width:100%">
    <h1>OWNCLUB<sup style="font-size:10px">®</sup></h1>
    <p class="muted">Own Club — Share Market</p>
    <div class="tabs">
      <button class="on" id="tLogin" onclick="showAuth('login')">LOG IN</button>
      <button id="tSign" onclick="showAuth('signup')">SIGN UP</button>
    </div>
    <div id="loginBox" class="card">
      <div class="field"><label>EMAIL OR PHONE</label><input id="loginId" autocomplete="username"></div>
      <div class="field"><label>PASSWORD</label><input id="loginPass" type="password"></div>
      <button class="btn" onclick="doLogin()">Log in</button>
    </div>
    <div id="signBox" class="card hidden">
      <div class="field"><label>NAME</label><input id="sName"></div>
      <div class="field"><label>PHONE</label><input id="sPhone" placeholder="+256... or +965..."></div>
      <div class="field"><label>EMAIL</label><input id="sEmail"></div>
      <div class="field"><label>PASSWORD</label><input id="sPass" type="password"></div>
      <div class="field"><label>CONFIRM PASSWORD</label><input id="sPass2" type="password"></div>
      <div class="field"><label>INVITE CODE</label><input id="sRef" placeholder="IMXT2Y0M8D"></div>
      <button class="btn" onclick="doSignup()">Create account</button>
    </div>
    <p class="muted" style="text-align:center;font-size:11px">KMK ™ Est 2018</p>
  </div>
</div>

<div class="app hidden" id="main">
  <div id="page-home">
    <h1>Own Club</h1>
    <p class="muted">Share Market</p>
    <div class="card">
      <div class="kpi"><span>Available</span><b id="bal">UGX 0</b></div>
      <div class="kpi"><span>Invite code</span><b id="inv">—</b></div>
      <button class="btn" onclick="openDep()">DEPOSIT</button>
      <button class="btn sec" onclick="openWd()">WITHDRAW</button>
    </div>
    <div class="card" id="sysCard" class="hidden"></div>
  </div>

  <div id="page-shares" class="hidden">
    <h2>Buy Club Shares</h2>
    <div class="league" id="leagues"></div>
    <div id="clubs"></div>
  </div>

  <div id="page-income" class="hidden">
    <h2>Income</h2>
    <div class="card" id="txList">No movement yet</div>
  </div>

  <div id="page-team" class="hidden">
    <h2>Team</h2>
    <div class="card">
      <div class="kpi"><span>Your code</span><b id="inv2">—</b></div>
      <p class="muted">L1 30% · L2 25% · L3 20% · L4 15% of a friend’s share purchase.</p>
      <div class="kpi"><span>Referral earnings</span><b id="refE">UGX 0</b></div>
    </div>
  </div>

  <div id="page-account" class="hidden">
    <h2>Account</h2>
    <div class="card">
      <div id="who"></div>
      <button class="btn sec" onclick="logout()">Log out</button>
    </div>
  </div>

  <nav class="nav">
    <button class="on" onclick="go('home',this)"><b>⌂</b>Home</button>
    <button onclick="go('shares',this)"><b>⚽</b>Shares</button>
    <button onclick="go('income',this)"><b>₿</b>Income</button>
    <button onclick="go('team',this)"><b>👥</b>Team</button>
    <button onclick="go('account',this)"><b>♙</b>Account</button>
  </nav>
</div>

<div id="modal" class="hidden" style="position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center">
  <div class="card" style="width:min(100%,520px);margin:0;border-radius:18px 18px 0 0" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var TOKEN = localStorage.getItem("oc_token") || "";
var ME = null, CLUBS = [], LEAGUES = [], LEAGUE = "";
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; setTimeout(function(){t.style.display="none"},2500); }
function api(path, method, body){
  var o = {method: method||"GET", headers:{"Content-Type":"application/json"}};
  if(TOKEN) o.headers.Authorization = "Bearer "+TOKEN;
  if(body) o.body = JSON.stringify(body);
  return fetch(path,o).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }); });
}
function showAuth(w){
  document.getElementById("loginBox").classList.toggle("hidden", w!=="login");
  document.getElementById("signBox").classList.toggle("hidden", w!=="signup");
  document.getElementById("tLogin").classList.toggle("on", w==="login");
  document.getElementById("tSign").classList.toggle("on", w==="signup");
}
function doLogin(){
  api("/api/login","POST",{identifier:document.getElementById("loginId").value, password:document.getElementById("loginPass").value})
    .then(function(r){ TOKEN=r.token; localStorage.setItem("oc_token",TOKEN); ME=r.user; boot(); })
    .catch(function(e){ toast(e.message); });
}
function doSignup(){
  var a=document.getElementById("sPass").value, b=document.getElementById("sPass2").value;
  if(a!==b){ toast("Passwords do not match"); return; }
  var ref=document.getElementById("sRef").value || "IMXT2Y0M8D";
  api("/api/register","POST",{
    name:document.getElementById("sName").value,
    phone:document.getElementById("sPhone").value,
    email:document.getElementById("sEmail").value,
    password:a, ref:ref
  }).then(function(r){ TOKEN=r.token; localStorage.setItem("oc_token",TOKEN); ME=r.user; boot(); })
    .catch(function(e){ toast(e.message); });
}
function logout(){ TOKEN=""; localStorage.removeItem("oc_token"); location.reload(); }
function money(n){ return "UGX "+Number(n||0).toLocaleString(); }
function renderMe(){
  if(!ME) return;
  document.getElementById("bal").textContent = money(ME.balance);
  document.getElementById("inv").textContent = ME.invite_code||"—";
  document.getElementById("inv2").textContent = ME.invite_code||"—";
  document.getElementById("refE").textContent = money(ME.referral_earnings);
  document.getElementById("who").innerHTML = "<b>"+(ME.name||"")+"</b><div class='muted'>"+(ME.email||"")+"<br>"+(ME.phone||"")+"</div>";
  var tx = (ME.transactions||[]).map(function(t){ return "<div class='kpi'><span>"+t.type+"<br><small>"+(t.date||"")+"</small></span><b>"+money(t.amount)+"</b></div>"; }).join("");
  document.getElementById("txList").innerHTML = tx || "No movement yet";
  var sys = document.getElementById("sysCard");
  if(ME.is_admin || ME.is_support){
    sys.classList.remove("hidden");
    sys.innerHTML = "<b>System</b><p class='muted'>Approve deposits in Admin panel</p><a class='btn' style='display:block;text-align:center;text-decoration:none' href='/admin'>OPEN SYSTEM</a>";
  }
}
function go(p, btn){
  ["home","shares","income","team","account"].forEach(function(n){
    document.getElementById("page-"+n).classList.toggle("hidden", n!==p);
  });
  document.querySelectorAll(".nav button").forEach(function(b){ b.classList.remove("on"); });
  if(btn) btn.classList.add("on");
}
function loadClubs(){
  api("/api/clubs").then(function(r){
    CLUBS=r.clubs||[]; LEAGUES=r.leagues||[];
    LEAGUE = LEAGUE || LEAGUES[0];
    var lg=document.getElementById("leagues");
    lg.innerHTML = LEAGUES.map(function(l){ return "<button class='"+(l===LEAGUE?"on":"")+"' onclick='setLeague(\""+l+"\")'>"+l+"</button>"; }).join("");
    drawClubs();
  }).catch(function(){});
}
function setLeague(l){ LEAGUE=l; loadClubs(); }
function drawClubs(){
  var box=document.getElementById("clubs");
  box.innerHTML = CLUBS.filter(function(c){return c.league===LEAGUE;}).map(function(c){
    return "<div class='club'><img src='"+c.photo+"' alt=''><div style='flex:1'><b>"+c.name+"</b><div class='muted'>"+c.marketValue+"</div></div><button class='btn' style='width:auto;padding:8px 12px;margin:0' onclick='buy("+c.id+")'>Buy</button></div>";
  }).join("");
}
function buy(id){
  var c = CLUBS.find(function(x){return x.id===id;}); if(!c) return;
  var html = "<h2>"+c.name+"</h2><p class='muted'>Daily coupon return · lock 1–4 weeks</p>";
  (c.tiers||[]).forEach(function(t){
    html += "<button class='btn' onclick='confirmBuy("+id+","+t.weeks+")'>"+t.label+" · UGX "+t.price.toLocaleString()+" · daily "+t.daily.toLocaleString()+"</button>";
  });
  html += "<button class='btn sec' onclick='closeM()'>Back</button>";
  openM(html);
}
function confirmBuy(id, weeks){
  api("/api/purchase","POST",{club_id:id, weeks:weeks}).then(function(r){
    ME=r.user; renderMe(); closeM(); toast("Shares purchased");
  }).catch(function(e){ toast(e.message); });
}
function openDep(){
  openM("<h2>Deposit</h2><p class='muted'>Min 3,000 · paste TxID after you pay</p>"
    +"<div class='field'><label>AMOUNT</label><input id='dAmt' value='35000'></div>"
    +"<div class='field'><label>METHOD</label><select id='dM'><option value='momo'>Mobile Money</option><option value='usdt'>USDT TRC20</option></select></div>"
    +"<div class='field'><label>TRANSACTION ID</label><input id='dTx'></div>"
    +"<button class='btn' onclick='sendDep()'>Submit</button><button class='btn sec' onclick='closeM()'>Back</button>");
  api("/api/me").then(function(r){
    if(r.pay) toast("Pay MoMo "+r.pay.momo+" or USDT "+r.pay.trc20);
  }).catch(function(){});
}
function sendDep(){
  api("/api/deposit","POST",{amount:document.getElementById("dAmt").value, method:document.getElementById("dM").value, txid:document.getElementById("dTx").value})
    .then(function(r){ ME=r.user; renderMe(); closeM(); toast(r.message); })
    .catch(function(e){ toast(e.message); });
}
function openWd(){
  openM("<h2>Withdraw</h2><p class='muted'>5% fee · after you have bought shares</p>"
    +"<div class='field'><label>AMOUNT</label><input id='wAmt'></div>"
    +"<button class='btn' onclick='sendWd()'>Submit</button><button class='btn sec' onclick='closeM()'>Back</button>");
}
function sendWd(){
  api("/api/withdraw","POST",{amount:document.getElementById("wAmt").value})
    .then(function(r){ ME=r.user; renderMe(); closeM(); toast(r.message); })
    .catch(function(e){ toast(e.message); });
}
function openM(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); document.getElementById("modal").style.display="flex"; }
function closeM(){ document.getElementById("modal").classList.add("hidden"); document.getElementById("modal").style.display="none"; }
function boot(){
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  renderMe(); loadClubs();
  api("/api/me").then(function(r){ ME=r.user; renderMe(); }).catch(function(){});
}
if(TOKEN){
  api("/api/me").then(function(r){ ME=r.user; boot(); }).catch(function(){ TOKEN=""; localStorage.removeItem("oc_token"); });
}
</script>
</body>
</html>
