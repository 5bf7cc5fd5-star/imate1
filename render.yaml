# Deploy on Render.com — https://render.com
services:
  - type: web
    name: imate1
    runtime: python
    plan: free
    buildCommand: "echo 'No build needed'"
    startCommand: "python3 server.py"
    envVars:
      - key: PORT
        value: "10000"
      - key: IMATE1_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: imate1-data
      mountPath: /app/data
      sizeGB: 1
